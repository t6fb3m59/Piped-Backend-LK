name: Docker Multi-Architecture Build (Experimental)

# Builds the experimental Piped backend image, pushed to a dedicated
# `:experimental` tag so the production `:latest`/`:hotspot`/etc. images
# served by the master branch stay untouched.
#
# Mirrors docker-build.yml but trims the variant matrix to a single image
# (azul-zulu) since experimental users don't need multiple JVM flavours.

on:
  push:
    paths-ignore:
      - "**.md"
    branches:
      - experimental

jobs:
  build-jdk:
    uses: ./.github/workflows/fat-build.yml

  build-docker:
    needs: build-jdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: piped.jar
      - name: Create Version File
        run: echo $(git log -1 --date=short --pretty=format:%cd)-$(git rev-parse --short HEAD) > VERSION
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all
          image: tonistiigi/binfmt:qemu-v7.0.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push experimental
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.azul.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: logicalkarma/piped:experimental
          cache-from: type=gha
          cache-to: type=gha,mode=max
